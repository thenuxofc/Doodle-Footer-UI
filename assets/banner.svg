<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300" role="img" aria-label="THENUX Doodle Crew Footer — UI Component" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#15100c"/>
      <stop offset="1" stop-color="#0a0a0d"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="52%" r="55%">
      <stop offset="0" stop-color="#ff6600" stop-opacity=".30"/>
      <stop offset="1" stop-color="#ff6600" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="edge" x1="0" x2="1">
      <stop offset="0" stop-color="#ff6600" stop-opacity="0"/>
      <stop offset=".5" stop-color="#ff9a3c"/>
      <stop offset="1" stop-color="#ff6600" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="hot" x1="0" x2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset=".5" stop-color="#fff"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff6600" stop-opacity="0"/>
      <stop offset=".5" stop-color="#ff6600" stop-opacity=".25"/>
      <stop offset="1" stop-color="#ff6600" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ff6600" stroke-opacity=".09" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-30%" y="-60%" width="160%" height="220%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowSm" x="-30%" y="-100%" width="160%" height="300%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="frame"><rect width="1000" height="300" rx="14"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1000" height="300" fill="url(#bg)"/>
    <rect width="1000" height="300" fill="url(#grid)"/>
    <rect width="1000" height="300" fill="url(#halo)"/>

    <!-- scanline -->
    <rect x="0" y="-60" width="1000" height="60" fill="url(#scan)">
      <animate attributeName="y" from="-60" to="300" dur="5s" repeatCount="indefinite"/>
    </rect>

    <!-- top + bottom glowing edges -->
    <rect x="0" y="0" width="1000" height="2" fill="url(#edge)" filter="url(#glowSm)"/>
    <rect x="0" y="298" width="1000" height="2" fill="url(#edge)" filter="url(#glowSm)"/>
    <rect x="-200" y="0" width="200" height="2" fill="url(#hot)" filter="url(#glowSm)">
      <animate attributeName="x" from="-200" to="1000" dur="3.6s" repeatCount="indefinite"/>
    </rect>
    <rect x="1000" y="298" width="200" height="2" fill="url(#hot)" filter="url(#glowSm)">
      <animate attributeName="x" from="1000" to="-200" dur="3.6s" repeatCount="indefinite"/>
    </rect>

    <!-- status chip -->
    <g font-family="'Courier New', Consolas, monospace" font-size="12" letter-spacing="3" fill="#ff9a3c">
      <circle cx="44" cy="46" r="4" fill="#ff6600" filter="url(#glowSm)">
        <animate attributeName="opacity" values="1;.25;1" dur="1.6s" repeatCount="indefinite"/>
      </circle>
      <text x="58" y="50">UI COMPONENT // v2026</text>
      <text x="956" y="50" text-anchor="end" fill="#6b6b73">REACT · SVG · CSS</text>
    </g>

    <!-- wordmark -->
    <g filter="url(#glow)">
      <text x="500" y="178" text-anchor="middle" font-family="Impact, 'Arial Black', 'Helvetica Neue', sans-serif" font-size="128" letter-spacing="16" fill="#fff">THENUX
        <animate attributeName="opacity" values="1;1;.86;1;1;.92;1" dur="6s" repeatCount="indefinite"/>
      </text>
    </g>
    <text x="500" y="178" text-anchor="middle" font-family="Impact, 'Arial Black', 'Helvetica Neue', sans-serif" font-size="128" letter-spacing="16" fill="none" stroke="#ff6600" stroke-width="1.5" stroke-opacity=".8" transform="translate(4 4)">THENUX</text>

    <!-- ground line -->
    <line x1="150" y1="200" x2="850" y2="200" stroke="#ff6600" stroke-width="2" stroke-dasharray="6 8" filter="url(#glowSm)">
      <animate attributeName="stroke-dashoffset" from="0" to="-56" dur="2.4s" repeatCount="indefinite"/>
    </line>

    <!-- subtitle -->
    <text x="500" y="238" text-anchor="middle" font-family="'Courier New', Consolas, monospace" font-size="19" letter-spacing="9" fill="#ff9a3c" filter="url(#glowSm)">DOODLE CREW FOOTER</text>
    <text x="500" y="268" text-anchor="middle" font-family="'Courier New', Consolas, monospace" font-size="12" letter-spacing="5" fill="#8a8a93">HAND-DRAWN  ·  INTERACTIVE  ·  ZERO DEPENDENCIES</text>

    <!-- corner brackets -->
    <g fill="none" stroke="#ff6600" stroke-width="2.5" filter="url(#glowSm)" stroke-linecap="square">
      <path d="M20 70V24H66"/>
      <path d="M980 70V24H934"/>
      <path d="M20 230V276H66"/>
      <path d="M980 230V276H934"/>
    </g>
  </g>
  <rect x=".5" y=".5" width="999" height="299" rx="14" fill="none" stroke="#ff6600" stroke-opacity=".35"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
